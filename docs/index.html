<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>ChatbotXERP Documentation</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta
      name="description"
      content="ChatbotXERP - Omnichannel Live CF & E-Commerce ERP Documentation"
    >
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    >
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
    >
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css"
    >
    <style>
    :root {
      --theme-color: #059669;
      --sidebar-width: 280px;
      --sidebar-nav-link-color--active: #059669;
      --sidebar-nav-link-font-weight--active: 600;
    }
    .app-name-link img {
      width: 160px;
      margin-bottom: 10px;
    }
    .markdown-section pre > code {
      border-radius: 6px;
    }
    </style>
  </head>
  <body>
    <div id="app">Loading ChatbotXERP documentation...</div>
    <script>
    "use strict"
    window.$docsify = {
      name: "ChatbotXERP",
      repo: "https://github.com/Exodaz/ChatbotXERP",
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86_400_000,
        paths: "auto",
        placeholder: "Search documentation...",
        noData: "No results found",
        depth: 4,
      },
      copyCode: {
        buttonText: "Copy",
        errorText: "Error",
        successText: "Copied",
      },
    }
    </script>
    <!-- Docsify v4 -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script
      src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"
    ></script>
    <script
      src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"
    ></script>
    <script
      src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"
    ></script>
    <script
      src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"
    ></script>
    <script
      src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"
    ></script>
    <script
      src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"
    ></script>
  </body>
</html>
